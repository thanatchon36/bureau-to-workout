[project]
name = "bureau-to-workout"
version = "0.1.0"
description = "Credit scoring and causal debt resolution under policy-shaped labels: two simulators with ground truth and the estimators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thanatchon Chongmankhong" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hf = ["skops>=0.10", "pyarrow>=14", "huggingface_hub>=0.24"]

[project.scripts]
bureau-to-workout = "bureau_to_workout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bureau_to_workout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
